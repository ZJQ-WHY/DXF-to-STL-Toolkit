<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>DXF 三维数模工具 · DXF → 3D Model (STL)</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#fafbfc; --sunken:#f0f2f5;
  --line:#e2e6ea; --line2:#edf0f3;
  --txt:#1b1f24; --txt2:#5a646e; --txt3:#8b939c;
  --accent:#2f6fed; --accent-weak:#eaf1ff; --accent-line:#bcd2fb;
  --ok:#128a4a; --ok-weak:#e6f6ed;
  --warn:#9a6b00; --warn-weak:#fff5da; --warn-line:#f0dca4;
  --err:#b6342a; --err-weak:#fdeceb;
  --radius:10px; --radius-s:7px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181c; --panel:#1c2025; --panel2:#191d21; --sunken:#12151a;
    --line:#2b3138; --line2:#23282e;
    --txt:#e7eaee; --txt2:#a2abb5; --txt3:#7b848e;
    --accent:#5c95ff; --accent-weak:#1b2634; --accent-line:#2f4company;
    --accent-line:#2f4a72;
    --ok:#3ec27e; --ok-weak:#12251b;
    --warn:#e0b054; --warn-weak:#2a2214; --warn-line:#4a3d22;
    --err:#ef6b60; --err-weak:#2b1917;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:13px/1.5 var(--sans);background:var(--bg);color:var(--txt);
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 11px;transition:.12s}
button:hover{border-color:var(--accent-line)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.06)}
button.ghost{background:transparent;border-color:transparent;color:var(--txt2)}
button.ghost:hover{background:var(--sunken);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 7px;width:100%;
}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:11.5px;background:var(--sunken);padding:1px 4px;border-radius:4px}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{font-size:14.5px;margin:0;font-weight:650;letter-spacing:.1px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:5px 12px;color:var(--txt2);background:transparent}
.seg button[aria-pressed=true]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

/* ---------- banner ---------- */
.banners{flex:0 0 auto;display:flex;flex-direction:column}
.banner{display:flex;gap:8px;align-items:flex-start;padding:6px 14px;font-size:12px;border-bottom:1px solid var(--line)}
.banner[hidden]{display:none}
.banner.warn{background:var(--warn-weak);color:var(--warn)}
.banner.err{background:var(--err-weak);color:var(--err)}
.banner.info{background:var(--accent-weak);color:var(--accent)}
.banner .bi{font-weight:700;flex:0 0 auto}

/* ---------- main ---------- */
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 296px;min-height:0;background:var(--bg)}
@media (max-width:1080px){ main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(240px,1fr) auto} }
.col{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.col.left{border-right:1px solid var(--line)}
.col.right{border-left:1px solid var(--line);overflow:auto}
.col.mid{background:var(--sunken);min-width:0}
.phead{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:650;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;flex:0 0 auto;
}
.phead .spacer{flex:1}

/* ---------- queue ---------- */
.drop{margin:10px;padding:18px 10px;border:1.5px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--txt3);font-size:12px;transition:.12s}
.drop.hot{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.drop b{display:block;color:var(--txt);font-size:12.5px;margin-bottom:3px}
.list{flex:1;overflow:auto;padding:0 8px 8px}
.item{display:flex;gap:6px;align-items:center;padding:6px 6px 6px 8px;border-radius:var(--radius-s);border:1px solid transparent;cursor:pointer;font-size:12px}
.item:hover{background:var(--panel2)}
.item[aria-current=true]{background:var(--accent-weak);border-color:var(--accent-line)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sz{color:var(--txt3);font-size:11px;font-variant-numeric:tabular-nums}
.item .del{
  flex:0 0 auto;width:20px;height:20px;padding:0;line-height:1;font-size:15px;border:0;
  border-radius:5px;background:transparent;color:var(--txt3);opacity:.55;transition:.12s;
}
.item:hover .del{opacity:1}
.item .del:hover{background:var(--err-weak);color:var(--err);opacity:1}
.item .del:focus-visible{opacity:1}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--txt3)}
.dot.done{background:var(--ok)} .dot.err{background:var(--err)} .dot.work{background:var(--accent);animation:pulse 1s infinite}
.dot.stale{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
.emptyhint{padding:14px 12px;color:var(--txt3);font-size:11.5px;line-height:1.7}

/* ---------- stage ---------- */
.stage-top{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
#stageWrap{position:relative;flex:1;min-height:0;overflow:hidden;background:
  linear-gradient(45deg,rgba(128,128,128,.045) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.045) 75%),
  linear-gradient(45deg,rgba(128,128,128,.045) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.045) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
#stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
/* 三维预览画布：与二维画布同一容器互斥切换。canvas 必须显式声明
   [hidden]{display:none}，否则 display:block 会盖掉 hidden 属性。 */
#stage3d{width:100%;height:100%;display:block;touch-action:none;cursor:grab;position:absolute;inset:0}
#stage3d.drag{cursor:grabbing}
#stage3d[hidden],#stage[hidden],#axis3d[hidden]{display:none}
.axis{position:absolute;right:10px;bottom:10px;width:58px;height:58px;pointer-events:none;opacity:.85}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--txt3);font-size:12.5px;text-align:center;pointer-events:none;padding:20px}
.ph svg{opacity:.35}
.chip{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:11px var(--mono);color:var(--txt2);box-shadow:var(--shadow)}
#busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.18);backdrop-filter:blur(1px);font-weight:600;color:var(--txt);gap:8px}
#busy[hidden]{display:none}
.spin{width:15px;height:15px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- params ---------- */
.pgroup{padding:10px 12px;border-bottom:1px solid var(--line2)}
.pgroup:last-child{border-bottom:0}
.pgroup>h3{margin:0 0 8px;font-size:11px;font-weight:650;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field>label{flex:1;font-size:12px;color:var(--txt2);min-width:0}
.field>label .v{color:var(--txt);font-family:var(--mono);font-size:11.5px}
.field>label .hint{display:block;font-size:10.5px;color:var(--txt3);line-height:1.45;margin-top:1px}
.field>.ctl{flex:0 0 auto;width:104px}
.field.stack{display:block}
.field.stack .ctl{width:100%;margin-top:4px}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tiers button{font-size:11.5px;padding:6px 4px;display:flex;flex-direction:column;gap:1px;align-items:center;line-height:1.35}
.tiers button small{font-size:10px;color:var(--txt3);font-family:var(--mono)}
.tiers button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.tiers button[aria-pressed=true] small{color:var(--accent)}
/* 轮廓角色列表：每行 = 序号 / 深度 / 角色 + 下拉 + 定位 */
.ringlist{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}
.ringrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel2);cursor:pointer}
.ringrow.sel{border-color:#d85a30;background:var(--warn-weak)}
.ringrow .ri{flex:1;min-width:0;font-size:11.5px;color:var(--txt2);line-height:1.45}
.ringrow .ri b{color:var(--txt);font-family:var(--mono)}
.ringrow .rg{color:var(--txt3);font-size:10.5px}
.ringrow select{width:78px;font-size:11px}

/* ---------- bottom bars ---------- */
.bars{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:0 18px;padding:7px 14px;font-size:12px;align-items:center}
.bar+.bar{border-top:1px solid var(--line2)}
.bar .k{color:var(--txt3);font-size:11px;margin-right:5px}
.bar .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.bar .val.big{font-size:13.5px;color:var(--accent)}
.sep{color:var(--line);margin:0 2px}
.bar .ok{color:var(--ok)} .bar .warn{color:var(--warn)} .bar .err{color:var(--err)} .bar .muted{color:var(--txt3)}
#actions{display:flex;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);flex:0 0 auto;background:var(--panel)}
/* 诊断条与诊断详情只在专业模式出现：.bar / .diagdetail 自带 display，
   必须显式声明 [hidden]{display:none}，否则类选择器会盖掉 hidden 特性。 */
#diagBar[hidden],#diagDetail[hidden]{display:none}
/* 导出文件名：输入框 + 实时结果预览 */
.expname{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);flex:0 0 auto}
.expname input{width:186px;font-size:12px;padding:4px 7px}
.expname input.bad{border-color:var(--warn-line);background:var(--warn-weak)}
#expNameTip{font-size:11px;color:var(--txt3);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diagdetail{display:none;padding:0 14px 10px;font-size:11.5px;color:var(--txt2)}
.diagdetail.open{display:block}
.diagdetail ul{margin:6px 0 0;padding-left:18px}
.diagdetail li{margin:2px 0;font-family:var(--mono);font-size:11px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}
.modal.open{display:flex}
.sheet{background:var(--panel);border-radius:14px;max-width:760px;width:100%;max-height:84dvh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sheet header{border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.sheet .body{overflow:auto;padding:16px 20px;font-size:13px;line-height:1.75}
.sheet .body h3{font-size:13.5px;margin:18px 0 6px}
.sheet .body h3:first-child{margin-top:0}
.sheet .body ol,.sheet .body ul{margin:6px 0;padding-left:20px}
.sheet .body li{margin:3px 0}
.sheet .body table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.sheet .body th,.sheet .body td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.sheet .body th{background:var(--panel2);font-weight:600}
.note{background:var(--ok-weak);border:1px solid var(--line);border-left:3px solid var(--ok);padding:9px 12px;border-radius:var(--radius-s);font-size:12.5px;margin:10px 0}
footer.ver{padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--txt3);font-family:var(--mono);word-break:break-all}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;display:flex;flex-direction:column;gap:6px;z-index:80;align-items:center;pointer-events:none}
.toast{background:var(--txt);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:12px;box-shadow:var(--shadow);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 data-i18n="app.title">DXF 线段链化 → SVG</h1>
    <span class="sub" data-i18n="app.sub">本地计算 · 不上传</span>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="mode">
    <button id="mSimple" data-ui="mode" data-val="simple" data-i18n="mode.simple" aria-pressed="true">简易</button>
    <button id="mPro" data-ui="mode" data-val="pro" data-i18n="mode.pro" aria-pressed="false">专业</button>
  </div>
  <div class="seg" role="group" aria-label="language">
    <button data-ui="lang" data-val="zh" data-i18n="lang.zh" aria-pressed="true">中文</button>
    <button data-ui="lang" data-val="en" data-i18n="lang.en" aria-pressed="false">EN</button>
  </div>
  <button class="ghost" id="btnHelp" data-i18n="btn.help">帮助</button>
</header>

<div class="banners">
  <div class="banner info" id="bnBrowser" hidden><span class="bi">i</span><span data-i18n="warn.browser"></span></div>
  <div class="banner err" id="bnError" hidden><span class="bi">×</span><span id="bnErrorText"></span></div>
  <div class="banner warn" id="bnUnsupported" hidden><span class="bi">!</span><span id="bnUnsupportedText"></span></div>
  <div class="banner warn" id="bnModel" hidden><span class="bi">!</span><span id="bnModelText"></span></div>
</div>

<main>
  <section class="col left">
    <div class="phead"><span data-i18n="queue.title">文件队列</span><span class="spacer"></span><button class="ghost" id="btnClear" style="padding:1px 7px;font-size:11px" data-i18n="btn.clear">清空</button></div>
    <div class="drop" id="drop">
      <b data-i18n="queue.drop">拖入 DXF 文件或文件夹</b>
      <span data-i18n="queue.dropSub">或点击选择文件</span>
    </div>
    <div class="list" id="list"></div>
    <div class="emptyhint" id="queueHint" data-i18n="queue.hint"></div>
  </section>

  <section class="col mid">
    <div class="stage-top">
      <div class="seg" role="group">
        <button data-ui="view" data-val="model" data-i18n="stage.view.model" aria-pressed="true">三维数模</button>
        <button data-ui="view" data-val="contour" data-i18n="stage.view.contour" aria-pressed="false">轮廓</button>
      </div>
      <div class="spacer"></div>
      <button class="ghost" id="btnZoomOut" title="-">−</button>
      <button class="ghost" id="btnZoomIn" title="+">+</button>
      <button class="ghost" id="btnFit" data-i18n="btn.fit">适应窗口</button>
      <button class="ghost" id="btnSpin" data-i18n="btn.spin">自动旋转</button>
    </div>
    <div id="stageWrap">
      <canvas id="stage3d"></canvas>
      <svg id="stage" hidden xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <svg class="axis" id="axis3d" hidden viewBox="-32 -32 64 64" aria-hidden="true"></svg>
      <div class="ph" id="placeholder">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>
        <div data-i18n="stage.placeholder">拖入 DXF 后自动链化并生成三维数模</div>
      </div>
      <div class="chip" id="chip" hidden></div>
      <div id="busy" hidden><span class="spin"></span><span data-i18n="msg.processing">处理中…</span></div>
    </div>
  </section>

  <section class="col right">
    <div class="phead"><span data-i18n="params.title">参数</span><span class="spacer"></span><span id="pMode" style="font-size:10px;font-weight:400"></span></div>
    <div id="params"></div>
  </section>
</main>

<div class="bars">
  <div class="bar" id="statBar"></div>
  <div class="bar" id="diagBar"></div>
  <div class="diagdetail" id="diagDetail"></div>
</div>

<div id="actions">
  <button class="primary" id="btnConvert" data-i18n="btn.convertAll">转换全部</button>
  <button id="btnExport" data-i18n="btn.export">导出</button>
  <span class="sep">|</span>
  <label class="expname" for="expName" data-i18n-title="exp.nameHint">
    <span data-i18n="exp.name">文件名</span>
    <input type="text" id="expName" maxlength="120" spellcheck="false" autocomplete="off" data-i18n-ph="exp.namePh">
  </label>
  <span id="expNameTip"></span>
  <span class="sep">|</span>
  <label class="exq" style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--txt)">
    <input type="checkbox" id="optStl"> <b data-i18n="exp.stl">三维数模 STL</b>
  </label>
  <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--txt2)">
    <input type="checkbox" id="optSvg"> <span data-i18n="exp.svg">SVG（附带）</span>
  </label>
  <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--txt2)">
    <input type="checkbox" id="optPng"> <span data-i18n="exp.png">PNG 预览</span>
  </label>
  <div class="spacer"></div>
  <span id="expMode" style="font-size:11px;color:var(--txt3)"></span>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <header>
      <div class="brand"><h1 id="mTitle"></h1></div>
      <div class="spacer"></div>
      <button class="ghost" id="btnModalClose" data-i18n="btn.close">关闭</button>
    </header>
    <div class="body" id="mBody"></div>
    <footer class="ver" id="mVer"></footer>
  </div>
</div>

<input type="file" id="fileInput" accept=".dxf,.DXF" multiple class="sr">
<div id="toast" aria-live="polite"></div>

<script>
/*==CORE_BEGIN==*/
/* ============================================================================
 *  CORE —— 纯函数区（无 DOM 依赖）
 *  该区块可被外部测试脚本整段抽取，用于离线回归验证。
 * ==========================================================================*/

/* ---------- 常量与数值工具 ---------- */
var DEG = Math.PI / 180;

function fmt(v, dp) {
  if (!isFinite(v)) return '0';
  var s = v.toFixed(dp === undefined ? 6 : dp);
  if (s.indexOf('.') >= 0) { s = s.replace(/0+$/, '').replace(/\.$/, ''); }
  if (s === '-0') s = '0';
  return s;
}
function dist(a, b) { var dx = b[0] - a[0], dy = b[1] - a[1]; return Math.sqrt(dx * dx + dy * dy); }

/* ---------- 导出文件名（纯逻辑，可离线回归） ----------

    'help.title': 'How to use',
    'help.intro': 'Turn a DXF made of many disconnected line segments into continuous contours, then extrude them along Z into a 3D-printable solid model (STL). Everything is computed locally in your browser — the drawing is never uploaded.',
    'help.s1t': 'Three steps',
    'help.s1': '<b>1 Drop</b> DXF files (or a folder) into the queue on the left. The <b>×</b> at the right of each row removes just that file, leaving the others untouched.<br><b>2 Pick a level</b> on the right — Lossless / High / Medium / Minimal. The level also drives the facet count and STL size.<br><b>3 Export</b>: click "Build model", then "Export". The <b>File name</b> field on the left of the export bar renames the output (leave it empty to keep the source name; <code>{name}</code> = source name, <code>{n}</code> = index) and the text beside it previews the exact names that will be written.<br><b>Tip</b>: changing any parameter on the right <b>recomputes and refreshes the preview in place immediately</b> — no need to click "Build model" again. In the middle, <b>drag to rotate</b> and <b>scroll to zoom</b> the 3D preview.',
    'help.s2t': 'Detail levels and facet count',
    'help.s2': 'Levels are defined by the share of vertices kept: <b>Lossless 100%</b> (original vertices, no simplification at all), <b>High 30%</b>, <b>Medium 10%</b>, <b>Minimal 3%</b>. Simplification uses Douglas-Peucker with a binary search on tolerance to hit the target vertex count exactly.<br>Facet count after extrusion = <b>(contour vertices − 2) × 2 for the two caps + contour vertices × 2 for the walls</b>. On the sample drawing shipped with this tool: Lossless is 7352 facets / ≈368 KB, Minimal is 232 facets / ≈12 KB. So <b>the level matters far more for STL than for a stroked SVG</b> — facet count drives slicing time and file size.',
    'help.s3t': '3D model parameters (Pro mode)',
    'help.s3': '<b>Extrusion height</b>: thickness extruded along Z (mm).<br><b>Exact-size</b>: simplification only removes vertices, so it also removes the drawing extremes and the model ends up slightly smaller (measured 0.199 / 0.180 mm on the Minimal level). Enabling this re-inserts the extremes at their original position so that <b>all four levels produce a model exactly the size of the drawing</b>, at a cost of 3–4 extra vertices. <b>Keep it on.</b><br><b>Placement</b>: defaults to "XY centered, Z from 0", which matches slicer habits; you can also keep the drawing coordinates.<br><b>Mirror X / Y</b>: faster than asking the customer to fix a mirrored drawing.<br><b>STL format</b>: binary is smaller and most compatible; ascii is easier to inspect.<br><b>Watertight self-check</b>: verifies that every edge is shared by exactly two facets, the Euler characteristic is 2, and normals point outward.<br><b>Flip normals</b>: a rescue switch, only for when a slicer shows the model inside-out.',
    'help.s4t': 'Geometry parameters (Pro mode)',
    'help.s4': '<b>Snap tolerance</b>: distance threshold for treating two endpoints as the same point. Default 0 requires exact equality; raise it to bridge small gaps automatically.<br><b>Curve flattening</b>: chord height error for arcs, circles, ellipses and splines — smaller is smoother and finer.<br><b>Drawing unit</b>: how many millimeters one drawing unit equals.<br>The SVG parameters (stroke width, color, keep offset, merge into one path) affect the <b>attached SVG export only</b> and never the 3D model.',
    'help.faq1q': 'Why does the model size differ from the drawing by a hair?',
    'help.faq1a': 'STL coordinates are 32-bit floats, which at the 300 mm scale gives a resolution of about 3×10⁻⁵ mm (30 nanometres) — that is the precision limit of the STL format itself and has no effect on 3D printing. Beyond that, as long as "Exact-size" stays on, the model bounding box matches the drawing numerically.',
    'help.faq2q': 'Why is text / hatching / dimensions missing?',
    'help.faq2a': 'Only geometry contours are converted (lines, polylines, arcs, circles, ellipses, splines, block references). Text, hatches and dimensions are not converted — and they are never silently skipped: the banner lists the ignored entity types and counts.',
    'help.faq3q': 'How are open contours and holes handled?',
    'help.faq3a': 'Extruding a solid requires closed contours. Open chains cannot become a solid, so they are explicitly reported and skipped (never silently turned into a wrong model). If the drawing has small gaps, raise "Snap tolerance" until the endpoints snap into a loop. Nested contours (holes) are <b>cut out automatically</b> by nesting depth (depth 0 solid / depth 1 hole / depth 2 island, alternating). In Pro mode the "Contour roles" panel lists every ring and lets you assign Solid / Hole / Ignore manually; to get the legacy behaviour back (fill everything), switch "Nested contours (holes)" to "Fill everything".',
    'help.faq4q': 'Is batch processing supported?',
    'help.faq4a': 'Yes. Drop several files or a whole folder, click "Build model", then "Export". With Chrome / Edge you can pick an output folder and files are written one by one; other browsers fall back to a ZIP download. Large batches of STL files take a while — please be patient.',
    'help.faq5q': 'How do I know the model will actually print?',
    'help.faq5a': 'Before export the tool runs a watertight self-check: every edge is shared by exactly two facets (no boundary or non-manifold edges), the Euler characteristic V−E+F = 2, and the signed volume is positive (normals point outward). These four cover the <b>not watertight</b> and <b>inside-out</b> errors that slicers most often report. The diagnostics bar shows the result; after loading the STL into your slicer, also confirm the size matches the drawing and that no repair is suggested.',

    'help.privacy': 'This page hard-codes <code>connect-src \'none\'</code> in its security policy, which blocks every network egress at the browser level (fetch / XHR / WebSocket / sendBeacon are all refused). Your drawing only ever lives in browser memory; chaining and extrusion issue no network request and the server never touches your file. The exported STL header <b>does not contain the source file name</b>, so no customer information travels with the file. Save this file locally, unplug the network cable, and it still works.',

function loadParams() {

    S.view = saved.view === 'contour' ? 'contour' : 'model';
  }
  PARAM_SCHEMA.forEach(function (d) { S.params[d.key] = d.def; });
  if (saved && saved.params) {
    PARAM_SCHEMA.forEach(function (d) { if (saved.params[d.key] !== undefined) S.params[d.key] = saved.params[d.key]; });
  }
  ['stl', 'svg', 'png'].forEach(function (k) { S['exp_' + k] = false; });

  if (saved && saved.exp) { ['stl', 'svg', 'png'].forEach(function (k) { S['exp_' + k] = !!saved.exp[k]; }); }

  if (S.mode === 'simple') {

  }

}

  var el = document.querySelector('[data-p="ratio"]');

function renderParams() {
  var host = $('#params'); host.innerHTML = '';

  GROUP_ORDER.forEach(function (g) {
    /* 「轮廓角色」不是普通参数项：它按当前文件的环列表动态渲染，单独处理。

    if (g.id === 'rings') {

    var items = PARAM_SCHEMA.filter(function (d) {

    if (!items.length) return;
    var box = document.createElement('div'); box.className = 'pgroup';
    var h = document.createElement('h3'); h.textContent = S.lang === 'en' ? g.en : g.zh; box.appendChild(h);

  /* 诊断详情同样只在专业模式出现 —— 简易界面保持「拖入 → 选档 → 导出」三步。 */
  if (S.mode === 'pro') {

function ringsPanel() {

  if (!rows.length) {

    return closed ? d + 'Z' : d;
  }
  /* 未参与挤出的开口链：灰虚线 —— 让用户一眼看到"这部分没进模型" */
  res.chains.forEach(function (c) {
    if (c.closed) return;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', pathD(c.pts, false));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#9aa4b2');
    p.setAttribute('stroke-width', '1');
    p.setAttribute('stroke-dasharray', '4 3');
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    g.appendChild(p);
  });
  /* 闭合环按「轮廓角色」着色，方便核对自动判定 / 手动指定 */
  var roles = res.ringRoles || [];
  res.chains.forEach(function (c, ci) {
    if (!c.closed) return;
    var r = roles[ci] || {};
    var role = r.role || 'solid';
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', pathD(c.pts, true));
    p.setAttribute('fill', 'none');
    p.setAttribute('data-ring', String(ci));
    var col = (S.params.strokeColor || '#000000');
    if (role === 'hole') col = '#2f6fed';
    else if (role === 'skip') col = '#9aa4b2';
    p.setAttribute('stroke', col);
    p.setAttribute('stroke-width', String(S.params.strokeWidth || 0.25));
    if (role === 'skip') p.setAttribute('stroke-dasharray', '5 4');
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('stroke-linecap', 'round');
    if (S.ringSel === ci) {                       /* 选中的环：加粗高亮 + 屏幕像素宽度 */
      p.setAttribute('stroke', '#d85a30');
      p.setAttribute('stroke-width', '2.4');
      p.setAttribute('vector-effect', 'non-scaling-stroke');
    }
    g.appendChild(p);
  });
  st.appendChild(g);
  st.setAttribute('viewBox', vb);
  VIEW.x = parseFloat(vb.split(' ')[0]); VIEW.y = parseFloat(vb.split(' ')[1]);
  VIEW.w = parseFloat(vb.split(' ')[2]); VIEW.h = parseFloat(vb.split(' ')[3]);
  fitView();
}

/* 缩放平移 */
(function bindPanZoom() {
  var st = $('#stage'), drag = null;
  st.addEventListener('pointerdown', function (e) {
    if (!VIEW._box) return;
    drag = { x: e.clientX, y: e.clientY, vx: VIEW.x, vy: VIEW.y };
    st.classList.add('drag'); st.setPointerCapture(e.pointerId);
  });
  st.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = st.getBoundingClientRect();
    var k = VIEW.w / r.width;
    VIEW.x = drag.vx - (e.clientX - drag.x) * k;
    VIEW.y = drag.vy - (e.clientY - drag.y) * k;

  });
  st.addEventListener('pointerup', function () { drag = null; st.classList.remove('drag'); });
  st.addEventListener('wheel', function (e) {
    if (!VIEW._box) return;
    e.preventDefault();
    var r = st.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    var k = e.deltaY < 0 ? 0.85 : 1 / 0.85;
    var cx = VIEW.x + fx * VIEW.w, cy = VIEW.y + fy * VIEW.h;
    VIEW.w *= k; VIEW.h *= k;
    VIEW.x = cx - fx * VIEW.w; VIEW.y = cy - fy * VIEW.h;
    applyView();
  }, { passive: false });
  $('#btnFit').addEventListener('click', viewFit);
  $('#btnZoomIn').addEventListener('click', function () { viewZoom(0.8); });
  $('#btnZoomOut').addEventListener('click', function () { viewZoom(1.25); });
  function zoom(k) {
    if (!VIEW._box) return;
    var cx = VIEW.x + VIEW.w / 2, cy = VIEW.y + VIEW.h / 2;
    VIEW.w *= k; VIEW.h *= k;
    VIEW.x = cx - VIEW.w / 2; VIEW.y = cy - VIEW.h / 2;
    applyView();

  window.__zoom2d = zoom;
})();

/* ============================================================================
 * 三维预览渲染器（正交投影 + 背面剔除 + 深度排序 + Lambert 明暗）
 *
 * 全部手写：不引入任何三维库，CSP 不放宽、仍是单文件零依赖。
 * 为什么用 painter's algorithm 而不用 z-buffer：模型是**闭合实体**，
 * 背面剔除之后前向面之间不存在互相遮挡，按质心深度排序即可得到正确结果，
 * 而且能直接用 canvas 2D 的填充路径，无需逐像素操作。
 * ==========================================================================*/
function themeIsDark() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch (e) { return false; }
}
/* 相机基向量 / 视图投影 / 网格包围盒 / 三维光栅化：
   这些是纯数学，已搬进上方 CORE 纯函数区（CORE_BEGIN 与 CORE_END 标记之间），
   以便在 node 里配合 mock 2D 上下文做离线回归 —— 见 tests/verify-core.js 的 M 段。 */
/* 坐标轴指示器（跟随相机旋转，帮助判断方向） */
function drawAxis3d() {
  var el = $('#axis3d');
  if (!el) return;
  if (S.view !== 'model') { setHidden(el, true); return; }
  setHidden(el, false);
  var B = camBasis(CAM.az, CAM.ex), L = 22;
  var axes = [[[1, 0, 0], 'X', '#d64545'], [[0, 1, 0], 'Y', '#2f9e44'], [[0, 0, 1], 'Z', '#2f6fed']];
  var out = '';
  axes.forEach(function (ax) {
    var v = ax[0];
    var sx = (v[0] * B.r[0] + v[1] * B.r[1] + v[2] * B.r[2]) * L;
    var sy = -(v[0] * B.u[0] + v[1] * B.u[1] + v[2] * B.u[2]) * L;
    out += '<line x1="0" y1="0" x2="' + sx.toFixed(1) + '" y2="' + sy.toFixed(1)
      + '" stroke="' + ax[2] + '" stroke-width="1.6" stroke-linecap="round"/>';
    out += '<text x="' + (sx * 1.32).toFixed(1) + '" y="' + (sy * 1.32 + 3).toFixed(1)
      + '" font-size="10" fill="' + ax[2] + '" text-anchor="middle">' + ax[1] + '</text>';
  });
  el.innerHTML = out;
}
function draw3d() {
  var cv = $('#stage3d'), ph = $('#placeholder'), chip = $('#chip');
  if (!cv) return;
  var a = active();
  if (!a || !a.res || !a.res.mesh) {
    if (ph) ph.style.display = '';
    if (chip) setHidden(chip, true);
    var c0 = cv.getContext && cv.getContext('2d');
    if (c0) { c0.clearRect(0, 0, cv.width, cv.height); }
    drawAxis3d();
    return;
  }
  if (ph) ph.style.display = 'none';
  if (chip) setHidden(chip, false);
  var ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;                     /* 无 canvas 环境（如 jsdom）：安全退出，不崩 */
  var dim = cvSize(cv);
  if (ctx.setTransform) ctx.setTransform(dim.dpr, 0, 0, dim.dpr, 0, 0);
  drawModelTo(ctx, dim.w, dim.h, a.res.mesh, CAM, themeIsDark());
  if (chip) chip.textContent = 'az ' + Math.round(CAM.az) + '° / ex ' + Math.round(CAM.ex)
    + '° · ×' + (CAM.zoom || 1).toFixed(2);
  drawAxis3d();
}
function cvSize(cv) {
  var r = cv.parentNode.getBoundingClientRect ? cv.parentNode.getBoundingClientRect() : { width: 0, height: 0 };
  var w = Math.max(1, Math.round(r.width || 0)), h = Math.max(1, Math.round(r.height || 0));
  var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  return { w: w, h: h, dpr: dpr };
}
/* 视图调度：三维数模（默认）/ 轮廓 */
function drawStage() {
  var isModel = S.view === 'model';
  var s2 = $('#stage'), s3 = $('#stage3d');
  setHidden(s2, isModel);
  setHidden(s3, !isModel);
  /* 切走的那一块必须清空：否则隐藏元素里会留着上一次的路径/像素，

  if (isModel) {

    var ctx = s3 && s3.getContext ? s3.getContext('2d') : null;
    if (ctx) ctx.clearRect(0, 0, s3.width, s3.height);

/* 按钮/窗口尺寸变化时的统一入口 */

function viewZoom(k) {

/* 三维交互：拖动旋转 / 滚轮缩放 / Shift+拖动 平移 */
(function bind3d() {
  var cv = $('#stage3d');
  if (!cv) return;

  cv.addEventListener('pointerdown', function (e) {
    var a = active(); if (!a || !a.res || !a.res.mesh) return;
    drag = { x: e.clientX, y: e.clientY, az: CAM.az, ex: CAM.ex, px: CAM.panX, py: CAM.panY, pan: !!e.shiftKey };
    cv.classList.add('drag');

  var r = a.res, s = r.unitScale;

  var wt;

    '<span><span class="k">' + t('stats.faces') + '</span><span class="val">' + (r.mstat ? r.mstat.faceCount : 0) + '</span></span>'

  }

  if (S.mode === 'pro') {
    cells.push('<span><span class="k">' + t('stats.vertices') + '</span><span class="val">' + r.rawVertexCount + ' → ' + r.outVertexCount +
      ' (' + pct.toFixed(1) + '%)</span></span>');
    cells.push('<span><span class="k">' + t('stats.deviation') + '</span><span class="val">' + devTxt + ' mm</span></span>');

}
function renderDiag() {

function diagHtml(r) {

    if (ks.length) {
      var n = 0; ks.forEach(function (k) { n += uns[k]; });
      $('#bnUnsupportedText').textContent = t('warn.unsupported', { n: n, list: ks.map(function (k) { return k + '×' + uns[k]; }).join(', ') });
      showBanner('bnUnsupported'); return;
    }
  }
  hideBanner('bnUnsupported');
}
/* 三维数模专项告警：水密失败 / 开口链被跳过 / 孔洞无宿主被跳过 / 轮廓自交。
   这些都是「会直接影响能不能打印」的问题，绝不能只躺在诊断详情里。 */
function renderModelBanner() {
  var a = active();
  if (!a || !a.res || !a.res.mstat) { hideBanner('bnModel'); return; }
  var r = a.res, msgs = [];
  if (!r.isWatertight) msgs.push(t('warn.notWatertight'));
  /* 嵌套轮廓：auto 模式已挖空（告知即可）；fill 模式没挖（需要用户确认） */
  if (r.nestedCount) {
    if (r.nestMode === 'fill') msgs.push(t('warn.nestedFilled', { n: r.nestedCount }));
    else msgs.push(t('warn.nestedHandled', { n: r.holeCount }));
  }
  if (r.orientMismatch) msgs.push(t('warn.orientMismatch', { n: r.orientMismatch }));
  if (r.openChains) msgs.push(t('warn.openChain', { n: r.openChains }));
  if (r.selfIntersections) msgs.push(t('warn.selfIntersect', { n: r.selfIntersections }));
  if (r.mstat.shellCount > 1) msgs.push(t('warn.shells', { n: r.mstat.shellCount }));
  if (!msgs.length) { hideBanner('bnModel'); return; }
  $('#bnModelText').textContent = msgs.join(' ');
  showBanner('bnModel');
}
function showBanner(id) { setHidden($('#' + id), false); }
function hideBanner(id) { setHidden($('#' + id), true); }
function showError(msg) { $('#bnErrorText').textContent = msg; showBanner('bnError'); setTimeout(function () { hideBanner('bnError'); }, 6000); }
function showBusy(on) { setHidden($('#busy'), !on); }

/* ---------------- 导出 ---------------- */
/* 输出项：{name, text} 走文本编码，{name, bytes} 直接落字节。
   STL 必须是字节（binary 是 ArrayBuffer 视图，绝不能当文本编码，否则文件损坏）。 */
/* 输出文件名：base 由 outputBaseName()（CORE 纯函数）算出，
   自定义命名规则只在那一处，导出/预览/ZIP 三处共用，不会各写一套。 */
function expBase(f, idx, total) {
  return outputBaseName(S.expName, String((f && f.name) || '').replace(/\.dxf$/i, ''), idx, total);
}
/* 名字实时预览：把「会导出成什么文件名」直接摆出来，避免导完才发现名字不对。
   文件都不在时才退回提示占位符用法。 */
function renderExpName() {
  var inp = $('#expName'), tip = $('#expNameTip');
  if (!inp || !tip) return;
  if (document.activeElement !== inp) inp.value = S.expName || '';
  var a = active();
  inp.placeholder = (a && a.name) ? String(a.name).replace(/\.dxf$/i, '') : t('exp.namePh');
  var ready = S.files.filter(function (f) { return f.status === 'done' && f.res; });
  if (!ready.length) { tip.textContent = t('exp.tokens'); return; }
  /* 当前选中的文件排在最前，预览的第一个名字就是他正在看的那张图 */
  ready.sort(function (x, y) {
    return (x.id === S.activeId ? -1 : 0) - (y.id === S.activeId ? -1 : 0);
  });
  var total = ready.length;
  var ext = S.exp_stl ? '.stl' : (S.exp_svg ? '.svg' : '.png');
  var sep = S.lang === 'en' ? ', ' : '、';
  var names = ready.slice(0, 2).map(function (f, i) { return expBase(f, i, total) + ext; });
  tip.textContent = total > 2
    ? t('exp.tipMore', { list: names.join(sep), n: total })
    : t('exp.tip', { list: names.join(sep) });
}
function buildOutputs(f, base) {
  var r = f.res, out = [];
  var opt = {
    unitScale: r.unitScale, strokeWidth: +S.params.strokeWidth || 0.25,
    strokeColor: S.params.strokeColor || '#000000',
    keepOffset: !!S.params.keepOffset, singlePath: !!S.params.singlePath
  };
  if (!base) base = String(f.name || 'drawing').replace(/\.dxf$/i, '');
  /* ---- 主功能：三维数模 ---- */
  if (S.exp_stl && r.mesh && r.mesh.tris.length) {
    var flip = !!S.params.flipNormals;
    if (S.params.stlFormat === 'ascii') {
      out.push({ name: base + '.stl', text: stlAscii(r.mesh, { flipNormals: flip }) });
    } else {
      out.push({ name: base + '.stl', bytes: stlBinary(r.mesh, { flipNormals: flip }), isStl: true });
    }
  }
  /* ---- 附带功能：SVG 轮廓（只影响 SVG，绝不影响三维数模）---- */
  if (S.exp_svg) out.push({ name: base + '.svg', text: svgFor(r.chains, r.bbox, opt) });
  return out;
}
function exportAll() {
  var ready = S.files.filter(function (f) { return f.status === 'done' && f.res; });
  if (!ready.length) { toast(t('msg.nothing')); return; }
  if (!S.exp_stl && !S.exp_svg && !S.exp_png) { toast(t('warn.noExport')); return; }
  var enc = new TextEncoder();
  var files = [], pngJobs = [], selfFail = 0, stlCount = 0;
  var total = ready.length;
  ready.forEach(function (f, i) {
    var base = expBase(f, i, total);
    buildOutputs(f, base).forEach(function (o) {
      var data = o.bytes ? o.bytes : enc.encode(o.text);
      files.push({ name: o.name, data: data });
      if (o.isStl) stlCount++;
      /* 导出前水密自检：校验的是**真正的输出字节**，不是内存里的网格 */
      if (o.isStl && S.params.selfCheck !== false) {
        try {
          var v = stlReadBack(o.bytes);
          /* χ > 2 是不可能的 —— 它正是「外板 + 埋在里面的独立小实体」那种
             错误模型的指纹（两个壳体各 χ=2，合计 4）。只查奇偶会放过它。 */
          if (!v.watertight || !v.normalsOutward || (v.euler % 2) !== 0 || v.euler > 2) selfFail++;
        } catch (e) { selfFail++; }
      }
    });
    if (S.exp_png) pngJobs.push({ f: f, base: base });
  });
  if (selfFail) showError(t('warn.notWatertight'));
  if (window.showDirectoryPicker) {
    showBusy(true);
    window.showDirectoryPicker({ mode: 'readwrite' }).then(function (dir) {
      var chain = Promise.resolve();
      files.forEach(function (o) {
        chain = chain.then(function () {
          return dir.getFileHandle(o.name, { create: true })
            .then(function (h) { return h.createWritable(); })
            .then(function (w) { return w.write(o.data).then(function () { return w.close(); }); });
        });
      });
      var pc = Promise.resolve();
      pngJobs.forEach(function (j) {
        pc = pc.then(function () { return pngBlob(j.f).then(function (b) { return b ? writeFile(dir, j.base + '.png', b) : null; }); });
      });
      return chain.then(function () { return pc; }).then(function () {
        showBusy(false);
        toast(t('msg.dirDone', { n: files.length + pngJobs.length }));
      });
    })['catch'](function (e) {
      showBusy(false);
      if (e && e.name === 'AbortError') return;          // 用户取消选择目录
      toast(String((e && e.message) || e));
    });
    return;
  }

  /* ---- 降级：ZIP 打包下载 ---- */
  showBusy(true);
  var seq = Promise.resolve();
  pngJobs.forEach(function (j) {
    seq = seq.then(function () {
      return pngBlob(j.f).then(function (b) {
        if (!b) return null;
        return blobToBytes(b).then(function (bytes) {
          files.push({ name: j.base + '.png', data: bytes });
        });
      });
    });
  });
  seq.then(function () {
    var zip = zipStore(files);
    var url = URL.createObjectURL(zip);
    var a = document.createElement('a');
    a.href = url; a.download = zipName(ready);
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 6000);
    showBusy(false);
    toast(t('msg.zipDone', { n: files.length }));
  })['catch'](function (e) {
    showBusy(false);
    toast(String((e && e.message) || e));
  });
}
/* ZIP 包名：自定义名优先（{name} 展开为第一个文件的原名），否则退回通用名前缀 */
function zipName(ready) {
  var zb = sanitizeFileName(S.expName).split('{name}').join(expBase(ready[0], 0, ready.length)).split('{n}').join('');
  zb = sanitizeFileName(zb) || 'dxf-toolkit-export';
  return zb + '-' + stamp() + '.zip';
}
function writeFile(dir, name, blob) {
  return dir.getFileHandle(name, { create: true })
    .then(function (h) { return h.createWritable(); })
    .then(function (w) { return w.write(blob).then(function () { return w.close(); }); });
}
function blobToBytes(b) { return b.arrayBuffer().then(function (ab) { return new Uint8Array(ab); }); }
function stamp() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
/* PNG 预览：三维视图的高分辨率截图（长边约 1600px）
   为什么改成画布截图：预览本身已经是三维模型，截图才能做到「所见即所得」。
   幅面按当前相机下的投影范围紧贴模型，不留大片空白。
   无 canvas 环境（如 jsdom）返回 null —— 明确跳过，不假装成功。 */
function pngBlob(f) {
  return new Promise(function (resolve) {
    if (!f || !f.res || !f.res.mesh) return resolve(null);
    var mesh = f.res.mesh, bb = meshBounds(mesh);
    var cv;
    try { cv = document.createElement('canvas'); } catch (e) { return resolve(null); }
    if (!cv.getContext) return resolve(null);
    var ctx;
    try { ctx = cv.getContext('2d'); } catch (e) { return resolve(null); }
    if (!ctx) return resolve(null);
    try {
      var B = camBasis(CAM.az, CAM.ex), fv = mesh.verts, i;
      var mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
      for (i = 0; i < fv.length; i += 3) {
        var vx = fv[i] - bb.c[0], vy = fv[i + 1] - bb.c[1], vz = fv[i + 2] - bb.c[2];
        var px = vx * B.r[0] + vy * B.r[1] + vz * B.r[2];
        var py = vx * B.u[0] + vy * B.u[1] + vz * B.u[2];
        if (px < mnx) mnx = px;
        if (px > mxx) mxx = px;
        if (py < mny) mny = py;
        if (py > mxy) mxy = py;
      }
      var pw = Math.max(1e-6, mxx - mnx), ph = Math.max(1e-6, mxy - mny);
      var LONG = 1600, PAD = 1.08;
      var scale = LONG / Math.max(pw, ph) / PAD;
      var W = Math.max(64, Math.round(pw * scale)), H = Math.max(64, Math.round(ph * scale));
      cv.width = W; cv.height = H;
      drawModelTo(ctx, W, H, mesh, { az: CAM.az, ex: CAM.ex, zoom: 1, panX: 0, panY: 0 },
        themeIsDark(), scale);
      if (!cv.toBlob) return resolve(null);
      cv.toBlob(function (b) { resolve(b || null); }, 'image/png');
    } catch (e) {
      resolve(null);
    }
  });
}

/* ---------------- 帮助弹窗 ---------------- */
var GLOSSARY = [
  ['链化', 'chaining'],
  ['无损', 'lossless'],
  ['顶点数压缩比', 'vertex reduction ratio'],
  ['最大偏差', 'maximum deviation'],
  ['断口', 'gap'],
  ['吸附容差', 'snap tolerance'],
  ['分支点', 'branch point'],
  ['开口链', 'open chain'],
  ['物理尺寸', 'physical size'],
  ['挤出', 'extrusion'],
  ['网格', 'mesh'],
  ['三角面', 'facet / triangle'],
  ['耳切三角化', 'ear clipping'],
  ['盖面 / 侧壁', 'cap / side wall'],
  ['水密', 'watertight'],
  ['流形 / 非流形边', 'manifold / non-manifold edge'],
  ['法向', 'normal'],
  ['实体数模', 'solid model (STL)'],
  ['包围盒', 'bounding box'],
  ['欧拉特征数', 'Euler characteristic']
];
function renderHelp() {
  $('#mTitle').textContent = t('help.title');
  $('#mVer').textContent = 'dxf-toolkit · v2.2.0 · single file · no network · no dependency' +
    ' · audit: no network API is called by this file (CSP blocks connect-src entirely)' +
    ' · integrity: full SHA-256 published in SHA256SUMS.txt next to this file';
  var rows = GLOSSARY.map(function (r) {
    return '<tr><td style="width:38%">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');
  $('#mBody').innerHTML =
    '<p>' + t('help.intro') + '</p>' +
    '<h3>' + t('help.s1t') + '</h3><p>' + t('help.s1') + '</p>' +
    '<h3>' + t('help.s2t') + '</h3><p>' + t('help.s2') + '</p>' +
    '<h3>' + t('help.s3t') + '</h3><p>' + t('help.s3') + '</p>' +
    '<h3>' + t('help.s4t') + '</h3><p>' + t('help.s4') + '</p>' +
    '<h3>' + t('help.privacyT') + '</h3><div class="note">' + t('help.privacy') + '</div>' +
    '<h3>FAQ</h3>' +
    '<p><b>' + t('help.faq1q') + '</b><br>' + t('help.faq1a') + '</p>' +
    '<p><b>' + t('help.faq2q') + '</b><br>' + t('help.faq2a') + '</p>' +
    '<p><b>' + t('help.faq3q') + '</b><br>' + t('help.faq3a') + '</p>' +
    '<p><b>' + t('help.faq4q') + '</b><br>' + t('help.faq4a') + '</p>' +
    '<p><b>' + t('help.faq5q') + '</b><br>' + t('help.faq5a') + '</p>' +
    '<h3>' + t('term.title') + '</h3><table><tbody>' + rows + '</tbody></table>';
  $('#modal').classList.add('open');
  $('#btnModalClose').focus();
}

/* ---------------- i18n 应用 ---------------- */
function applyI18n() {
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'zh';
  document.title = t('app.title');
  $$('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n');
    if (k) el.textContent = t(k);
  });
  /* title / placeholder 不是 textContent，得单独过一遍（否则切语言时留在旧语言） */
  $$('[data-i18n-title]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-title');
    if (k) el.title = t(k);
  });
  $$('[data-i18n-ph]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-ph');
    if (k) el.placeholder = t(k);
  });
}
function syncSegs() {
  $$('[data-ui]').forEach(function (b) {
    var kind = b.getAttribute('data-ui'), v = b.getAttribute('data-val'), cur;
    if (kind === 'mode') cur = S.mode;
    else if (kind === 'lang') cur = S.lang;
    else cur = S.view;
    b.setAttribute('aria-pressed', String(cur === v));
  });
}

/* ---------------- 事件绑定 ---------------- */
function filesFromDataTransfer(dt) {
  var out = [];
  var items = dt.items ? Array.prototype.slice.call(dt.items) : [];
  var entries = [];
  items.forEach(function (it) {
    if (it.kind === 'file' && it.webkitGetAsEntry) {
      var e = it.webkitGetAsEntry();
      if (e) entries.push(e);
    }
  });
  if (!entries.length) return Promise.resolve(Array.prototype.slice.call(dt.files || []));
  function walk(entry) {
    return new Promise(function (res) {
      if (!entry) return res();
      if (entry.isFile) {
        entry.file(function (f) { out.push(f); res(); }, function () { res(); });
      } else if (entry.isDirectory) {
        var rd = entry.createReader();
        (function batch() {
          rd.readEntries(function (list) {
            if (!list || !list.length) return res();
            Promise.all(list.map(walk)).then(batch, batch);
          }, function () { res(); });
        })();
      } else { res(); }
    });
  }
  return Promise.all(entries.map(walk)).then(function () { return out; });
}
function bind() {
  $$('[data-ui]').forEach(function (b) {
    b.addEventListener('click', function () {
      var kind = b.getAttribute('data-ui'), v = b.getAttribute('data-val');
      if (kind === 'mode') {
        if (S.mode === v) return;
        S.mode = v; saveParams(); syncSegs(); renderParams();
        /* 统计条与诊断条的**内容本身与模式有关**（简易模式不出水密/自检项），
           所以切模式必须重渲染这两条，不能只重画预览。 */
        renderStats(); renderDiag(); renderExpName();
        drawStage();
      } else if (kind === 'lang') {
        if (S.lang === v) return;
        S.lang = v; saveParams(); applyI18n(); syncSegs(); renderParams();
        renderQueue(); renderStats(); renderDiag(); renderEnvBanner();
        if ($('#modal').classList.contains('open')) renderHelp();
      } else {
        if (S.view === v) return;
        S.view = v; saveParams(); syncSegs();
        if (v !== 'model' && CAM.spin) {                 /* 离开三维视图 → 停自动旋转 */
          CAM.spin = false;
          var sb = $('#btnSpin'); if (sb) sb.setAttribute('aria-pressed', 'false');
        }
        drawStage();
      }
    });
  });

  var drop = $('#drop');
  drop.addEventListener('click', function () { $('#fileInput').click(); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); drop.classList.remove('hot'); });
  });
  drop.addEventListener('drop', function (e) {
    filesFromDataTransfer(e.dataTransfer).then(addFiles);
  });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    if (drop.contains(e.target)) return;
    filesFromDataTransfer(e.dataTransfer).then(addFiles);
  });
  $('#fileInput').addEventListener('change', function (e) {
    addFiles(e.target.files);
    e.target.value = '';
  });
  $('#btnClear').addEventListener('click', clearAll);
  $('#btnConvert').addEventListener('click', convertAll);
  $('#btnExport').addEventListener('click', exportAll);
  $('#btnHelp').addEventListener('click', renderHelp);
  $('#btnModalClose').addEventListener('click', function () { $('#modal').classList.remove('open'); });
  $('#modal').addEventListener('click', function (e) {
    if (e.target === $('#modal')) $('#modal').classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#modal').classList.contains('open')) $('#modal').classList.remove('open');
  });
  [['optStl', 'exp_stl', 'stl'], ['optSvg', 'exp_svg', 'svg'], ['optPng', 'exp_png', 'png']].forEach(function (row) {
    var el = $('#' + row[0]);
    if (!el) return;
    el.addEventListener('change', function () { S[row[1]] = el.checked; saveParams(); renderExpName(); });
  });
  /* 导出文件名：输入时就按最终规则预览（脏字符当次即清理，失焦把输入框归一化到实际值） */
  var nameIn = $('#expName');
  if (nameIn) {
    nameIn.addEventListener('input', function () {
      var clean = sanitizeFileName(nameIn.value);
      S.expName = clean;
      nameIn.classList.toggle('bad', clean !== nameIn.value.trim());
      saveParams(); renderExpName();
    });
    nameIn.addEventListener('change', function () {
      var clean = sanitizeFileName(nameIn.value);
      if (clean !== nameIn.value) { nameIn.value = clean; toast(t('exp.cleaned')); }
      nameIn.classList.remove('bad');
      S.expName = clean; saveParams(); renderExpName();
    });
  }
  /* 事件委托：参数面板会被 renderParams() 整块重建，直接 bind 到元素上的监听会失效 */
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-p') === 'unit') S.unitTouched = true;
    var rr = el.getAttribute('data-ringrole');       /* 轮廓角色下拉（面板会重建 → 必须委托） */
    if (rr !== null) setRingRole(parseInt(rr, 10), el.value);
  });
  document.addEventListener('click', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var rl = el.getAttribute('data-ringlocate');
    if (rl !== null) {                                /* 「定位」→ 切到轮廓视图并高亮该环 */
      S.ringSel = parseInt(rl, 10);
      if (S.view !== 'contour') { S.view = 'contour'; saveParams(); syncSegs(); }
      renderParams(); drawStage();
      return;
    }
    if (el.id === 'btnRoleReset') {                   /* 全部恢复自动 */
      var a0 = active();
      if (a0) { a0.roleOv = null; a0.roleOvSig = null; computeFile(a0, null); }
      renderParams();
      return;
    }
    var row = el.closest ? el.closest('.ringrow') : null;
    if (row) {                                        /* 点行 → 选中该环 */
      S.ringSel = parseInt(row.getAttribute('data-ring'), 10);
      renderParams(); drawStage();
    }
  });
  /* 轮廓视图里直接点环也能选中 */
  if ($('#stage')) {
    $('#stage').addEventListener('click', function (e) {
      var el = e.target;
      var ri = el && el.getAttribute ? el.getAttribute('data-ring') : null;
      if (ri === null || ri === undefined) return;
      S.ringSel = parseInt(ri, 10);
      renderParams(); drawStage();
    });
  }
  window.addEventListener('resize', viewRefresh);
}

/* ---------------- 启动 ---------------- */
function init() {
  loadParams();
  applyI18n();
  syncSegs();
  renderParams();
  var nameIn = $('#expName');
  if (nameIn) {
    nameIn.value = S.expName || '';
    nameIn.classList.remove('bad');
  }
  $('#optStl').checked = !!S.exp_stl;
  $('#optSvg').checked = !!S.exp_svg;
  $('#optPng').checked = !!S.exp_png;
  renderQueue();
  renderStats();
  renderDiag();
  renderEnvBanner();
  renderUnsupported();
  renderModelBanner();
  bind();
  drawStage();
}
init();
